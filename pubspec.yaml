name: auth_service_mobile
description: "Auth Service Mobile — Flutter client for the Auth Service platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  # HTTP client (mirrors axios on web)
  http: ^1.2.0
  # App-wide state management (mirrors React contexts on web)
  provider: ^6.1.2
  # Persistent key-value storage (mirrors Jotai atomWithStorage / localStorage on web)
  shared_preferences: ^2.2.2
  # Google SSO (mirrors @react-oauth/google on web)
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
